#
# E2E + aspect + spec gates. Zig is installed from the official tarball
# (no extra Actions). Idris2 is not assumed on the runner.

name: E2E + Aspect + Bench
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'ffi/**'
      - 'tests/**'
      - 'verification/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'ffi/**'
      - 'tests/**'
      - 'verification/**'
  workflow_dispatch:
permissions: read-all
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aspect-tests:
    name: Aspect — Architectural Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash tests/aspect_tests.sh
      - run: bash tests/core_spec.sh
      - run: bash tests/evidence_spec.sh
      - run: bash tests/manifest_spec.sh
      - run: bash tests/backend_spec.sh
      - run: bash tests/projection_spec.sh

  e2e-zig:
    name: E2E — Zig FFI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.15.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"
      - run: zig version
      - run: bash tests/e2e.sh
      - run: bash tests/p2p.sh
      - run: cd src/api/zig && zig test adapter.zig
