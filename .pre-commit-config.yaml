# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for panoply.
# Optional host tool. Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: local
    hooks:
      - id: validate-deed
        name: Validate DEED manifests
        entry: bash .github/hooks/validate-deed.sh
        language: system
        pass_filenames: false
      - id: root-shape
        name: Root allowlist
        entry: bash scripts/check-root-shape.sh
        language: system
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.1
    hooks:
      - id: editorconfig-checker
        exclude: '(\\.git|node_modules|target|_build|deps|\\.deno|external_corpora|\\.lake|\\.zig-cache)/'
